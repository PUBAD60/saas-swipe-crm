<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>SaaS Swipe CRM</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#0d1117;--mute:#6b7280;--line:#e5e7eb;--blue:rgb(0,88,246);--bluebg:#eaf1ff;--ok:#0a7d4b;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#14171c;--ink:#eef0f3;--mute:#8b93a1;--line:#242932;--bluebg:#0f2247;--blue:#5b92ff;--ok:#3ecf8e;--warn:#f0a53a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Geist,Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--card)}
aside h1{font-size:15px;margin:0 8px 14px}aside h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 8px 6px}
.nav{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}.nav:hover{background:var(--bg)}.nav.on{background:var(--bluebg);color:var(--blue);font-weight:600}.nav span{color:var(--mute);font-weight:400}
main{padding:16px 20px 60px;min-width:0}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.bar input{flex:1;min-width:220px}button{cursor:pointer}button:hover{border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{border-color:var(--blue);transform:translateY(-2px)}
.card .im{aspect-ratio:16/10;background:#222 center top/cover;position:relative}.card .im .st{position:absolute;top:8px;right:8px}
.card .b{padding:10px 12px}.card .t{font-weight:600;display:flex;justify-content:space-between;gap:8px}.card .d{color:var(--mute);font-size:12.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mute);margin:6px 4px 0 0}
.chip.blue{background:var(--bluebg);color:var(--blue);border-color:transparent}.chip.warn{color:var(--warn)}.chip.ok{color:var(--ok)}
.stars{color:#f5b301;letter-spacing:1px;white-space:nowrap}
.drawer{position:fixed;inset:0 0 0 auto;width:min(860px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-20px 0 60px #0004;transform:translateX(105%);transition:.22s;overflow:auto;z-index:20}
.drawer.open{transform:none}.drawer .in{padding:20px 24px 60px}
.shot{width:100%;border:1px solid var(--line);border-radius:10px;display:block}.full{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}.full img{width:100%;display:block}
h2{margin:0 0 4px;font-size:22px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 0 8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px}.kv div:nth-child(odd){color:var(--mute)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}
.tabs button{margin-right:6px}.tabs button.on{background:var(--bluebg);color:var(--blue);border-color:var(--blue)}
.note{background:var(--bg);border-left:3px solid var(--blue);padding:8px 12px;border-radius:0 8px 8px 0;margin:6px 0}
.unv{border-left-color:var(--warn)}
textarea{width:100%;min-height:90px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.star{font-size:22px;cursor:pointer;color:var(--line)}.star.on{color:#f5b301}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto}}
</style></head><body>
<div class="app">
<aside id="side"></aside>
<main>
  <div class="bar">
    <input id="q" placeholder="Search name, positioning, headline, copy, notes…">
    <select id="sort"><option value="niche">Sort: niche</option><option value="name">Name A–Z</option><option value="rating">My rating</option><option value="craft">Craft signals</option></select>
    <button id="exp">Export my CRM</button><button id="imp">Import</button><input id="file" type="file" accept=".json" hidden>
  </div>
  <div id="count" style="color:var(--mute);margin-bottom:10px"></div>
  <div class="grid" id="grid"></div>
</main></div>
<div class="drawer" id="dr"></div>
<script src="data.js"></script>
<script>
const S=window.SITES||[];const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let crm={};try{crm=JSON.parse(localStorage.getItem('swipe-crm')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('swipe-crm',JSON.stringify(crm))}catch(e){}};
const C=id=>crm[id]||(crm[id]={rating:0,status:'To study',tags:'',note:''});
const STAT=['To study','Studied','Using this','Skip'];
const F={niche:'All',source:'All',theme:'All',status:'All',tag:'All',q:''};
const TAGNAME={'hero-centered':'Centered hero','hero-left':'Left-aligned hero','hero-product-ui':'Product UI in hero','hero-3d-webgl':'3D / WebGL hero','hero-video':'Video hero','hero-email-capture':'Email capture hero','logo-strip-under-hero':'Logos under hero','bento':'Bento grid','feature-grid':'Feature grid','stats-band':'Stats band','testimonials':'Testimonials','pricing-on-home':'Pricing on home','faq':'FAQ','final-cta':'Final CTA','serif-headline':'Serif headline','italic-accent':'Italic accent','huge-headline':'Huge headline','tight-tracking':'Tight tracking','mono-labels':'Mono labels','gsap':'GSAP','smooth-scroll':'Smooth scroll','three-webgl':'Three.js','webgl-canvas':'Canvas/WebGL','framer':'Framer Motion','lottie':'Lottie','rive':'Rive','spline':'Spline','webflow':'Webflow','nextjs':'Next.js','astro':'Astro','sticky-nav':'Sticky nav','pill-buttons':'Pill buttons','sharp-buttons':'Sharp buttons','one-or-two-ctas':'1-2 hero CTAs','long-page':'Long page','short-page':'Short page','product-demo-section':'Product demo section','logo-wall':'Logo wall'};
const shot=s=>s.capture&&s.capture.ok?`shots/${s.id}.jpg`:(s.vaultImg?`vault-img/${s.vaultImg}`:'');
function facets(){
  const cnt=(f)=>{const m={};S.forEach(s=>f(s).forEach(v=>m[v]=(m[v]||0)+1));return m};
  const nm=cnt(s=>s.niches),sm=cnt(s=>[s.source]),tm=cnt(s=>[s.capture?.facts?.theme||'unknown']);
  const blk=(h,key,m)=>`<h4>${h}</h4>`+`<div class="nav ${F[key]=='All'?'on':''}" data-k="${key}" data-v="All">All <span>${S.length}</span></div>`+Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([v,n])=>`<div class="nav ${F[key]==v?'on':''}" data-k="${key}" data-v="${esc(v)}">${esc(v)} <span>${n}</span></div>`).join('');
  const st={};S.forEach(s=>{const x=C(s.id).status;st[x]=(st[x]||0)+1});
  const tgm={};S.forEach(s=>(s.insight?.tags||[]).forEach(t=>{if(TAGNAME[t])tgm[TAGNAME[t]]=(tgm[TAGNAME[t]]||0)+1}));
  $('#side').innerHTML=`<h1>SaaS Swipe CRM</h1>`+blk('Niche','niche',nm)+blk('Pattern (what to steal)','tag',tgm)+blk('Source','source',sm)+blk('Theme (live)','theme',tm)+blk('My status','status',st);
}
function pass(s){
  if(F.niche!='All'&&!s.niches.includes(F.niche))return false;
  if(F.source!='All'&&s.source!=F.source)return false;
  if(F.theme!='All'&&(s.capture?.facts?.theme||'unknown')!=F.theme)return false;
  if(F.status!='All'&&C(s.id).status!=F.status)return false;
  if(F.tag!='All'&&!(s.insight?.tags||[]).some(t=>TAGNAME[t]==F.tag))return false;
  if(F.q){const f=s.capture?.facts||{};const hay=[s.name,s.url,s.positioning,s.design,s.copy,(s.samNotes||[]).join(' '),f.h1,f.sub,f.description,C(s.id).note,C(s.id).tags].join(' ').toLowerCase();if(!F.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w)))return false}
  return true;
}
function render(){
  facets();
  let L=S.filter(pass);const so=$('#sort').value;
  L.sort((a,b)=>so=='name'?a.name.localeCompare(b.name):so=='rating'?C(b.id).rating-C(a.id).rating:so=='craft'?(b.insight?.craft||0)-(a.insight?.craft||0):a.niches[0].localeCompare(b.niches[0])||a.name.localeCompare(b.name));
  $('#count').textContent=`${L.length} of ${S.length} sites`;
  $('#grid').innerHTML=L.map(s=>{const f=s.capture?.facts||{},c=C(s.id),im=shot(s);
    return `<div class="card" data-id="${s.id}"><div class="im" style="background-image:url('${im}')"></div><div class="b">
    <div class="t"><span>${esc(s.name)}</span><span class="stars">${'★'.repeat(c.rating)}</span></div>
    <div class="d">${esc(f.h1||s.positioning||(s.samNotes||[])[0]||s.url)}</div>
    ${s.niches.map(n=>`<span class="chip blue">${esc(n)}</span>`).join('')}${f.theme?`<span class="chip">${f.theme}</span>`:''}${s.capture&&!s.capture.ok?'<span class="chip warn">no live capture</span>':''}${s.source=='added'?'<span class="chip">added</span>':''}</div></div>`}).join('');
}
function open(id){
  const s=S.find(x=>x.id==id),f=s.capture?.facts||{},c=C(id);
  const sw=(v)=>v?`<span class="sw" style="background:${v}"></span>${esc(v)}`:'—';
  const kv=(k,v)=>v?`<div>${k}</div><div>${v}</div>`:'';
  $('#dr').innerHTML=`<div class="in"><div class="row" style="justify-content:space-between"><div><h2>${esc(s.name)}</h2><a href="https://${esc(s.url)}" target="_blank" style="color:var(--blue)">${esc(s.url)} ↗</a>${s.urlGuess?' <span class="chip warn">url guessed</span>':''}</div><button id="x">Close ✕</button></div>
  <div>${s.niches.map(n=>`<span class="chip blue">${esc(n)}</span>`).join('')}<span class="chip">${s.source}</span></div>
  <div class="tabs" style="margin:14px 0 8px"><button class="on" data-t="h">Hero</button><button data-t="f">Full page</button>${s.vaultImg?'<button data-t="v">Your vault shot</button>':''}</div>
  <div id="vw">${shot(s)?`<img class="shot" src="${shot(s)}">`:'<div class="note">No screenshot yet.</div>'}</div>
  ${s.capture&&!s.capture.ok?`<div class="note unv">Live capture failed: ${esc(s.capture.error)}</div>`:''}
  <h3>My CRM</h3>
  <div class="row"><span id="stars">${[1,2,3,4,5].map(i=>`<span class="star ${c.rating>=i?'on':''}" data-r="${i}">★</span>`).join('')}</span>
  <select id="st">${STAT.map(x=>`<option ${c.status==x?'selected':''}>${x}</option>`).join('')}</select>
  <input id="tg" placeholder="tags: hero, pricing, motion…" value="${esc(c.tags)}" style="flex:1"></div>
  <textarea id="nt" placeholder="What to steal from this site…" style="margin-top:8px">${esc(c.note)}</textarea>
  ${s.insight?`<h3>Analysis (from the live page)</h3>
  ${s.insight.flow?`<div style="margin-bottom:8px"><b>Section flow</b><div>${s.insight.flow.split(' → ').map(x=>`<span class="chip blue">${esc(x)}</span>`).join(' ')}</div></div>`:''}
  ${s.insight.design.length?`<div class="note"><b>Design</b><ul>${s.insight.design.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
  ${s.insight.positioning.length?`<div class="note"><b>Positioning</b><ul>${s.insight.positioning.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
  ${s.insight.copy.length?`<div class="note"><b>Copy</b><ul>${s.insight.copy.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
  <div class="note" style="border-left-color:var(--ok)"><b>What your AI can take</b><ul>${s.insight.steal.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="row" style="justify-content:space-between;margin-top:10px"><b>AI brief (paste into your AI)</b><button id="cb">Copy brief</button></div>
  <pre style="white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px">${esc(s.insight.aiBrief)}</pre>
  <div>${s.insight.tags.filter(t=>TAGNAME[t]).map(t=>`<span class="chip">${TAGNAME[t]}</span>`).join('')}</div>`:''}
  ${f.h1||f.title?`<h3>Live on the site (captured ${'today'})</h3><div class="kv">
  ${kv('Headline',esc(f.h1))}${kv('Subline',esc(f.sub))}${kv('Meta desc.',esc(f.description))}${kv('CTAs',esc((f.cta||[]).join(' · ')))}${kv('Nav',esc((f.nav||[]).join(' · ')))}${kv('Sections',esc((f.h2||[]).join(' › ')))}
  ${kv('Fonts',esc([f.headingFont,f.bodyFont].filter((v,i,a)=>v&&a.indexOf(v)==i).join(' / ')+(f.h1Size?` · H1 ${f.h1Size}px`:'')))}${kv('Theme',esc(f.theme))}${kv('Background',sw(f.bg))}${kv('Accent btn',sw(f.accent))}${kv('Page height',f.pageHeight?f.pageHeight+'px':'')}</div>`:''}
  ${(s.samNotes||[]).length?`<h3>Your notes (Obsidian)</h3>${s.samNotes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}`:''}
  ${s.positioning||s.design||s.copy?`<h3>Research notes — from your pasted list, not verified</h3>
  ${s.positioning?`<div class="note unv"><b>Positioning</b><br>${esc(s.positioning)}</div>`:''}${s.design?`<div class="note unv"><b>Design</b><br>${esc(s.design)}</div>`:''}${s.copy?`<div class="note unv"><b>Copy</b><br>${esc(s.copy)}</div>`:''}
  <div style="color:var(--mute);font-size:12px">These can be stale (e.g. sites re-brand). Compare with "Live on the site" above.</div>`:''}
  </div>`;
  $('#dr').classList.add('open');
  $('#x').onclick=()=>$('#dr').classList.remove('open');
  if($('#cb'))$('#cb').onclick=async()=>{try{await navigator.clipboard.writeText(s.insight.aiBrief);$('#cb').textContent='Copied ✓'}catch(e){$('#cb').textContent='Select and copy manually'}};
  $('#stars').onclick=e=>{const r=+e.target.dataset.r;if(!r)return;c.rating=c.rating==r?0:r;save();open(id);render()};
  $('#st').onchange=e=>{c.status=e.target.value;save();render()};
  $('#tg').oninput=e=>{c.tags=e.target.value;save()};$('#nt').oninput=e=>{c.note=e.target.value;save()};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    $('#vw').innerHTML=b.dataset.t=='f'?`<div class="full"><img src="shots/${s.id}-full.jpg" onerror="this.outerHTML='No full-page shot'"></div>`:b.dataset.t=='v'?`<img class="shot" src="vault-img/${s.vaultImg}">`:`<img class="shot" src="${shot(s)}">`});
}
document.addEventListener('click',e=>{const n=e.target.closest('.nav');if(n){F[n.dataset.k]=n.dataset.v;render();return}const c=e.target.closest('.card');if(c)open(c.dataset.id)});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#dr').classList.remove('open')});
$('#q').oninput=e=>{F.q=e.target.value;render()};$('#sort').onchange=render;
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(crm,null,1)],{type:'application/json'}));a.download='swipe-crm-backup.json';a.click()};
$('#imp').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{crm=JSON.parse(await e.target.files[0].text());save();render()}catch(x){alert('Bad file')}};
render();
</script></body></html>
